<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e5a8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>到商場去｜將軍澳培智學校</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(165deg,#D6EEFF 0%,#E8F6FF 50%,#FFF8E8 100%);color:#1a3a5c;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column}
.header{flex:0 0 auto;text-align:center;padding:6px 10px;background:rgba(255,255,255,.7);
  border-bottom:3px solid #7eb8e8;position:relative;z-index:5}
/* 校名/校徽唔再每頁置頂阻遊戲：只主頁顯示 */
.header .brand{display:none;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
body.home .header .brand{display:flex}
.header .logo{width:44px;height:44px;object-fit:contain;flex:0 0 auto;border-radius:10px;background:#fff;
  border:2px solid #a8d4f5;box-shadow:0 2px 8px rgba(30,90,138,.12)}
.header .brand-text{text-align:left}
.header h1{font-size:clamp(1.05rem,3.2vw,1.45rem);font-weight:900;color:#1e5a8a;letter-spacing:.03em;line-height:1.15}
.header .sub{font-size:clamp(.85rem,2.2vw,1rem);font-weight:800;color:#3a7ab0}
.topbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:0}
body.home .topbar{justify-content:center;margin-top:4px}
body.play .header{padding:4px 8px}
body.play .icon-btn{min-width:44px;min-height:44px}
.icon-btn{min-width:48px;min-height:48px;border-radius:14px;border:3px solid #7eb8e8;background:#fff;
  font-size:1.25rem;font-weight:900;color:#1e5a8a;cursor:pointer;padding:0 12px}
.icon-btn:active{transform:scale(.96)}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}
.footer{flex:0 0 auto;text-align:center;padding:6px;font-size:.85rem;font-weight:700;color:#4a6f90;
  background:rgba(255,255,255,.45);border-top:2px solid #b8d9f0}
.screen{display:none;width:min(860px,100%);margin:0 auto}
.screen.on{display:block}
.card{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 10px 28px rgba(30,90,138,.14);
  border:3px solid #a8d4f5}
.card h2{font-size:clamp(1.35rem,3.8vw,1.85rem);font-weight:900;text-align:center;margin-bottom:12px;color:#1e5a8a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.btn{min-height:56px;min-width:120px;padding:12px 18px;border-radius:16px;border:3px solid #5aa0d8;
  background:linear-gradient(180deg,#4aa3e8,#2b8ad9);color:#fff;font-size:1.2rem;font-weight:900;
  cursor:pointer;box-shadow:0 4px 0 #1a6aa8}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1a6aa8}
.btn.sec{background:linear-gradient(180deg,#fff,#eef6ff);color:#1e5a8a;border-color:#7eb8e8;box-shadow:0 4px 0 #a8cce8}
.btn.ok{background:linear-gradient(180deg,#5ad67a,#2faf52);border-color:#2a9a48;box-shadow:0 4px 0 #1f7a38}
.btn.warn{background:linear-gradient(180deg,#ffb84d,#f08c1a);border-color:#d97810;box-shadow:0 4px 0 #b8620c}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip{min-height:52px;padding:10px 14px;border-radius:14px;border:3px solid #b8d4ee;background:#f4faff;
  font-size:1.1rem;font-weight:900;color:#1e5a8a;cursor:pointer}
.chip.on{border-color:#2b8ad9;background:#d9efff;box-shadow:0 0 0 3px rgba(43,138,217,.25)}
.id-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.id-card{border:3px solid #b8d4ee;border-radius:16px;background:#f7fbff;padding:10px 6px;text-align:center;
  cursor:pointer;min-height:88px;font-weight:900}
.id-card .emoji{font-size:2rem;line-height:1.2}
.id-card .name{font-size:1rem;color:#1e5a8a;margin-top:4px}
.id-card.on{border-color:#2b8ad9;background:#d9efff;box-shadow:0 0 0 3px rgba(43,138,217,.28)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr}.id-grid{grid-template-columns:repeat(4,1fr)}}
.mode-btn{border:3px solid #9cc9ea;border-radius:18px;background:#f7fbff;padding:14px 10px;cursor:pointer;
  text-align:center;min-height:92px}
.mode-btn .t{font-size:1.25rem;font-weight:900;color:#1e5a8a}
.mode-btn .d{font-size:.95rem;font-weight:700;color:#4a7aa0;margin-top:4px}
.mode-btn:active{transform:scale(.98)}
.prompt{text-align:center;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;color:#163e66;margin:6px 0 12px;
  min-height:2.2em}
.prompt mark{background:#ffe08a;color:#163e66;padding:2px 8px;border-radius:8px}
.opts{display:grid;gap:12px;margin-top:4px}
.opts.n2{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-columns:1fr 1fr 1fr}
.opts.n4{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
@media(max-width:560px){.opts.n3{grid-template-columns:1fr 1fr}.opts.n3 .opt:last-child{grid-column:1/-1;max-width:70%;justify-self:center}}
.opt{position:relative;border:4px solid #b5d4ef;border-radius:18px;background:#fff;padding:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;min-height:140px;overflow:hidden}
.opt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f0f7ff}
.opt .lab{margin-top:8px;font-size:clamp(1.05rem,3vw,1.35rem);font-weight:900;color:#1a3a5c}
.opt .badge{position:absolute;top:8px;left:8px;width:42px;height:42px;border-radius:50%;background:#2b8ad9;
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;
  border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:2}
.opt.correct{border-color:#2faf52;background:#e8fbeb;box-shadow:0 0 0 4px rgba(47,175,82,.25)}
.opt.wrong{border-color:#e74c3c;background:#fdecea;opacity:.85}
.opt.disabled{pointer-events:none}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  font-weight:900;color:#1e5a8a;font-size:1.05rem}
.basket-zone{margin-top:12px;border:3px dashed #7eb8e8;border-radius:18px;background:#f0f8ff;min-height:100px;
  padding:10px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.basket-zone.hot{background:#d9efff;border-color:#2b8ad9}
.basket-zone .ph{font-size:1.15rem;font-weight:800;color:#5a86a8}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.shelf-item{border:3px solid #b5d4ef;border-radius:16px;background:#fff;padding:6px;text-align:center;cursor:grab;
  touch-action:none;user-select:none}
.shelf-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;pointer-events:none}
.shelf-item .lab{font-weight:900;margin-top:4px;font-size:1rem}
.shelf-item.gone{opacity:.25;pointer-events:none}
.phrase-board{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
.slot{min-width:120px;min-height:72px;border:3px dashed #7eb8e8;border-radius:14px;background:#f4faff;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:#1e5a8a;padding:8px}
.slot.filled{border-style:solid;background:#e8f6ff}
.tile-pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{min-width:100px;min-height:64px;border-radius:14px;border:3px solid #5aa0d8;background:#fff;
  font-size:1.35rem;font-weight:900;color:#1e5a8a;cursor:pointer;padding:8px 14px}
.tile.used{opacity:.3;pointer-events:none}
.fb{text-align:center;font-size:1.25rem;font-weight:900;min-height:1.6em;margin:8px 0;color:#1e5a8a}
.fb.ok{color:#1f8a3c}.fb.bad{color:#c0392b}
.cert{text-align:center;padding:18px 10px}
.cert .medal{font-size:4.5rem;line-height:1}
.cert .title{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;margin:8px 0;color:#1e5a8a}
.cert .meta{font-size:1.2rem;font-weight:800;color:#3a6f96;margin:4px 0}
.teacher{margin-top:14px;border-top:2px dashed #c5dced;padding-top:10px}
.teacher summary{font-weight:900;color:#3a7ab0;cursor:pointer;font-size:1rem}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(20,50,80,.92);color:#fff;
  padding:12px 18px;border-radius:14px;font-weight:900;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}


/* UX v1.8 home + play */
body.play .footer{display:none}
body.home #btn-home{display:none}
.prompt{font-size:clamp(1.55rem,5.2vw,2.15rem)!important;line-height:1.35;margin:8px 0 14px!important;min-height:2.4em}
.hero-path{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 8px}
.mode-btn.hero{min-height:110px;padding:16px 14px;border-width:4px;border-color:#2b8ad9;
  background:linear-gradient(180deg,#dff1ff,#b9e0ff);box-shadow:0 8px 0 #1a6aa8}
.mode-btn.hero .t{font-size:1.65rem}
.mode-btn.hero .d{font-size:1.02rem;color:#1e5a8a}
.mode-btn.hero:active{transform:translateY(2px);box-shadow:0 4px 0 #1a6aa8}
.mode-btn.hero.hero-retro{min-height:84px;border-color:#e94560;background:linear-gradient(180deg,#2a1a2e,#16213e);box-shadow:0 6px 0 #7a1830}
.mode-btn.hero.hero-retro .t{color:#ff6b81;font-size:1.35rem}
.mode-btn.hero.hero-retro .d{color:#a0aec0;font-size:.95rem}
.sec-label{font-weight:900;color:#1e5a8a;margin:8px 0 4px;font-size:1.05rem}
.home-top{display:grid;grid-template-columns:1fr;gap:6px}
.more-modes{margin-top:6px;border:3px solid #b8d4ee;border-radius:16px;background:#f4faff;padding:8px 10px}
.more-modes>summary{font-weight:900;color:#1e5a8a;cursor:pointer;font-size:1.1rem;list-style:none;
  display:flex;align-items:center;justify-content:space-between;padding:8px 4px}
.more-modes>summary::-webkit-details-marker{display:none}
.more-modes>summary::after{content:"▼";font-size:.9rem;color:#3a7ab0}
.more-modes[open]>summary::after{content:"▲"}
.zone-title{font-weight:900;color:#3a7ab0;margin:10px 0 6px;font-size:1rem}
.zone-title.retro{color:#c44569}
#after-row{flex-direction:column;align-items:stretch;gap:10px;margin-top:10px}
#after-row .btn-main{width:100%;min-height:72px;font-size:1.55rem;order:1}
#after-row .after-sec{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;order:2}
#after-row .after-sec .btn{min-height:48px;font-size:1.05rem;min-width:110px;padding:10px 14px}
#after-row.ok-mode #btn-next{display:block}
#after-row.ok-mode #btn-retry{display:none}
#after-row.bad-mode #btn-next{display:none}
#after-row.bad-mode #btn-retry.btn-main{display:block}
#path-progress{display:none;margin:2px 0 8px;text-align:center}
#path-progress.on{display:block}
.path-now{font-size:1.05rem;font-weight:900;color:#1e5a8a;margin-bottom:6px}
.path-dots{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.path-dots .dot{width:26px;height:26px;border-radius:50%;background:#c5dced;border:3px solid #7eb8e8;
  box-shadow:inset 0 0 0 2px #fff}
.path-dots .dot.done{background:#2faf52;border-color:#1f8a3c}
.path-dots .dot.now{background:#f5c542;border-color:#d97810;transform:scale(1.2);
  box-shadow:0 0 0 4px rgba(245,197,66,.35)}
.id-grid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:8px;margin:4px 0 6px}
.id-card{min-height:70px;padding:8px 6px}
.id-card .emoji{font-size:1.7rem}
.id-card .name{font-size:.95rem}
.chip{min-height:46px;padding:8px 12px;font-size:1.05rem}
.card h2{margin-bottom:4px}
body.home .header{padding:4px 10px}
body.home .header .logo{width:36px;height:36px}
body.home .header h1{font-size:clamp(.95rem,2.8vw,1.2rem)}
body.home .header .sub{font-size:clamp(.78rem,2vw,.9rem)}
body.home .tagline{margin-bottom:4px!important;font-size:.95rem}
.stage-overlay{position:fixed;inset:0;z-index:120;background:rgba(20,50,80,.55);display:none;
  align-items:center;justify-content:center;padding:16px}
.stage-overlay.on{display:flex}
.stage-card{background:#fff;border:4px solid #2b8ad9;border-radius:22px;padding:28px 22px;text-align:center;
  max-width:420px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.25);animation:stagePop .35s ease}
.stage-card .big{font-size:3rem;line-height:1;margin-bottom:8px}
.stage-card .t{font-size:1.6rem;font-weight:900;color:#1e5a8a}
.stage-card .d{font-size:1.15rem;font-weight:800;color:#3a7ab0;margin-top:6px}
@keyframes stagePop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
#cert-print-root{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body *{display:none!important}
  #cert-print-root, #cert-print-root *{display:block!important;visibility:visible!important}
  #cert-print-root{position:fixed;left:0;top:0;width:100%;height:100%;padding:18mm 16mm;box-sizing:border-box;
    text-align:center;font-family:"PingFang HK","Noto Sans TC",sans-serif;color:#1a3a5c}
  #cert-print-root img{display:inline-block!important;width:72px;height:72px;object-fit:contain;margin:0 auto 8px}
  #cert-print-root .medal{font-size:64px;line-height:1;margin:6px 0}
  #cert-print-root .title{font-size:36px;font-weight:900;color:#1e5a8a;margin:8px 0}
  #cert-print-root .meta{font-size:22px;font-weight:800;color:#3a6f96;margin:6px 0}
}
/* RETRO modes */
.retro-stage{position:relative;width:100%;height:min(58vh,420px);border-radius:16px;overflow:hidden;
  border:4px solid #1e5a8a;background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 2px,transparent 2px 4px),
  linear-gradient(180deg,#9ad0ff 0%,#c8e8ff 40%,#7ecf8a 40%,#5bb86a 100%);image-rendering:pixelated}
.retro-stage.scan::after{content:"";pointer-events:none;position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);z-index:9}
.retro-hud-target{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:8;
  background:rgba(255,255,255,.92);border:3px solid #1e5a8a;border-radius:12px;padding:6px 12px;
  font-weight:900;font-size:1.15rem;color:#1e5a8a;display:flex;align-items:center;gap:8px;max-width:95%}
.retro-hud-target img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:2px solid #7eb8e8}
.catch-basket{position:absolute;bottom:8px;width:110px;height:70px;margin-left:-55px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:left .05s linear}
.catch-basket .bin{width:100%;height:48px;background:linear-gradient(180deg,#f5c542,#e09a12);border:3px solid #8a5a00;
  border-radius:8px 8px 12px 12px;box-shadow:0 4px 0 #8a5a00}
.catch-basket.magnet .bin{box-shadow:0 0 16px 6px rgba(255,220,80,.7),0 4px 0 #8a5a00}
.catch-basket.rainbow .bin{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff)}
.fall-item{position:absolute;width:64px;height:64px;margin-left:-32px;z-index:4;border-radius:12px;
  border:3px solid #fff;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2);overflow:hidden}
.fall-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.fall-item.poison{border-color:#e74c3c;box-shadow:0 0 0 3px rgba(231,76,60,.35)}
.fall-item .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:.65rem;font-weight:900;text-align:center;padding:1px 0}
.retro-ctrl{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.retro-ctrl .big{min-width:88px;min-height:64px;font-size:1.6rem;font-weight:900;border-radius:16px;
  border:4px solid #1e5a8a;background:linear-gradient(180deg,#fff,#d9efff);color:#1e5a8a;cursor:pointer;
  box-shadow:0 4px 0 #1a4a72;touch-action:manipulation}
.retro-ctrl .big:active{transform:translateY(2px);box-shadow:0 2px 0 #1a4a72}
.run-stage{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;height:min(52vh,380px)}
.run-stage.lanes2{grid-template-columns:1fr 1fr}
.run-lane{position:relative;border-radius:14px;border:3px solid #7eb8e8;background:linear-gradient(180deg,#e8f6ff,#b8dcf5);
  overflow:hidden;cursor:pointer}
.run-lane.on{border-color:#f5c542;box-shadow:inset 0 0 0 4px rgba(245,197,66,.45)}
.run-lane.good-flash{background:linear-gradient(180deg,#d4f8dc,#7edc92)!important}
.run-lane.bad-flash{background:linear-gradient(180deg,#ffe0e0,#f5a0a0)!important}
.run-player{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:56px;height:56px;
  font-size:2.2rem;z-index:5;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));transition:bottom .15s}
.run-gate{position:absolute;left:8%;right:8%;height:88px;border-radius:12px;border:3px solid #1e5a8a;
  background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:3;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.run-gate img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.run-gate .glab{font-size:.85rem;font-weight:900;color:#1e5a8a;margin-top:2px}
.talk-wrap{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
@media(max-width:560px){.talk-wrap{grid-template-columns:1fr}}
.npc{text-align:center}
.npc .face{font-size:3.2rem;line-height:1;font-weight:900;animation:npcbounce 1.2s ease-in-out infinite}
@keyframes npcbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{background:#fff;border:4px solid #1e5a8a;border-radius:16px;padding:12px 14px;font-weight:900;
  font-size:1.2rem;color:#1e5a8a;min-height:72px;position:relative}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right-color:#1e5a8a}
.pixel-bar{display:inline-block;background:#1e5a8a;color:#fff;padding:2px 8px;border-radius:4px;font-size:.85rem;margin-bottom:6px}
.receipt{display:inline-flex;align-items:center;gap:6px;background:#fffbe8;border:2px dashed #c9a227;border-radius:10px;
  padding:4px 8px;font-weight:900;font-size:.9rem;margin:4px}
.mode-btn.retro{background:linear-gradient(180deg,#1a1a2e,#16213e);border-color:#e94560;color:#eee}
.mode-btn.retro .t{color:#ff6b81}.mode-btn.retro .d{color:#a0aec0}

/* CART RUSH - 賽道對決 */
.cart-stage{position:relative;width:100%;height:min(60vh,440px);border-radius:16px;overflow:hidden;
  border:4px solid #1e5a8a;
  background:linear-gradient(180deg,#87ceeb 0%,#b8e0d2 35%,transparent 35%),
             linear-gradient(180deg,#a8d8a8 35%,#5a8a4a 100%);}
.cart-sky{position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,#87ceeb 0%,#b8e0d2 100%);z-index:0}
.cart-cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:50%;
  width:60px;height:18px;top:8%;animation:cart-cloud 12s linear infinite}
.cart-cloud::before,.cart-cloud::after{content:"";position:absolute;background:rgba(255,255,255,.7);border-radius:50%}
.cart-cloud::before{width:30px;height:30px;top:-15px;left:8px}
.cart-cloud::after{width:24px;height:24px;top:-10px;right:10px}
.cart-cloud.c1{left:-80px;animation-delay:0s}

<script>
/* BUY_XX_MASTER_V1_8_SEN */
const ITEMS = {
  // 文具類（4）— 對齊評估卷
  "bag":       {"label": "書包",   "img": "assets/bag.jpg",       "cat": "stationery"},
  "case":      {"label": "筆盒",   "img": "assets/case.jpg",      "cat": "stationery"},
  "pencil":    {"label": "鉛筆",   "img": "assets/pencil.jpg",    "cat": "stationery"},
  "ruler":     {"label": "間尺",   "img": "assets/ruler.jpg",     "cat": "stationery"},
  // 食物類（4）— 蛋糕由原本嘅 mall 移入，令食物類夠 4 件撐到 hard 4 選
  "milk":      {"label": "牛奶",   "img": "assets/milk.jpg",      "cat": "food"},
  "apple":     {"label": "蘋果",   "img": "assets/apple.jpg",     "cat": "food"},
  "orange":    {"label": "橙",     "img": "assets/orange.jpg",    "cat": "food"},
  "cake":      {"label": "蛋糕",   "img": "assets/cake.jpg",      "cat": "food"},
  // 玩具類（3）
  "doll":      {"label": "洋娃娃", "img": "assets/doll.jpg",      "cat": "toy"},
  "basketball":{"label": "籃球",   "img": "assets/basketball.jpg","cat": "toy"},
  "football":  {"label": "足球",   "img": "assets/football.jpg",  "cat": "toy"},
  // 分類詞（無圖）— 只可做砌短語產出，唔可以入選擇題（會造成歧義正確答案）
  "wenju":     {"label": "文具",   "cat": "category"}
};
const IDS = Object.keys(ITEMS);
const ALL = IDS.slice();
// 有圖 = 可做選擇題圖片選項 / 出題目標
const SELECTABLE = IDS.filter(k => ITEMS[k].img);
// 無圖 = 分類詞，只可做 build 產出
const WORDONLY  = IDS.filter(k => !ITEMS[k].img);
const byCat = c => ALL.filter(k => ITEMS[k].cat === c);
const PIC_CATS = [...new Set(SELECTABLE.map(k => ITEMS[k].cat))];
const CAT_LABEL = {stationery:'文具', food:'食物', toy:'玩具', category:'分類詞'};
const LETTERS = ['A','B','C','D'];
const IDENTITIES = [
  {id:'star', emoji:'⭐', name:'小星星'},
  {id:'cat', emoji:'🐱', name:'小貓咪'},
  {id:'dog', emoji:'🐶', name:'小狗狗'},
  {id:'rabbit', emoji:'🐰', name:'小兔子'},
  {id:'bear', emoji:'🐻', name:'小熊熊'},
  {id:'fish', emoji:'🐟', name:'小魚兒'},
  {id:'bird', emoji:'🐦', name:'小小鳥'},
  {id:'friend', emoji:'😊', name:'同學'}
];
const HOME_IDS = IDENTITIES.slice(0, 4);
const PATH = ['listen','shop','judge','build','need'];
const PATH_RETRO = ['catch','talk','run'];
const MODE_LABEL = {
  path:'一條龍', 'path-retro':'Retro一條龍', listen:'聽圖選', shop:'店員任務', judge:'啱定錯', build:'砌短語', need:'要定唔要',
  catch:'接貨小店員', talk:'像素店員', run:'商場走線',
  cart:'購物車極速'
};
const NEED_SCENES = [
  {q:'書包破咗，去買新書包？', good:'買書包', bad:'一次買十個書包', goodId:'bag', why:'有需要先買'},
  {q:'鉛筆用完，去買鉛筆？', good:'買鉛筆', bad:'買完即刻掉', goodId:'pencil', why:'有需要先買'},
  {q:'已經有筆盒，仲要唔要再買好多？', good:'唔使再買', bad:'再買五個筆盒', goodId:'case', why:'唔好浪費'},
  {q:'肚餓想飲奶，買牛奶？', good:'買牛奶', bad:'買十盒即刻倒掉', goodId:'milk', why:'有需要先買'},
  {q:'想玩球，家裡已有籃球，再買？', good:'唔使再買', bad:'再買好多籃球', goodId:'basketball', why:'唔好浪費'},
  {q:'間尺仲用得，要唔要再買多支？', good:'唔使再買', bad:'再買十支間尺', goodId:'ruler', why:'唔好浪費'},
  {q:'想食蛋糕慶祝，買一個蛋糕？', good:'買蛋糕', bad:'買完掉入垃圾桶', goodId:'cake', why:'有需要先買'}
];

const S = {
  identity: IDENTITIES[0],
  diff: 'easy',
  // D1：詞彙範圍。'all' = 沿用舊隨機行為；'stationery' / 'mall' = 老師鎖定，
  // 一旦鎖定，全部模式（含 arcade）都只可以用該範圍嘅詞彙。
  vocabScope: 'all',
  catchSpeed: 'slow',  // 'slow' | 'mid' | 'fast' — 影響 Retro 模式速度
  mode: 'path',
  pathIdx: 0,
  qCount: 4,
  qIndex: 0,
  recSeq: 0,        // 記錄層用：跨關卡單調遞增，唔會因 path 每關重設 qIndex 而撞 key
  correct: 0,
  answered: 0,
  locked: false,
  pickOk: false,
  cur: null,
  answerSpeak: '',
  queue: [],
  live: null,
  pathList: PATH
};

// Retro sub-difficulty：拆 spawn（高=等更耐）vs speed（高=跌更快）
// slow = SEN 預設（最易），fast = 挑戰
const CATCH_SUB = {
  slow: { spawnMul: 1.5,  speedMul: 0.4 },
  mid:  { spawnMul: 1.0,  speedMul: 0.75 },
  fast: { spawnMul: 0.65, speedMul: 1.0 }
};
function catchSub(){ return CATCH_SUB[S.catchSpeed] || CATCH_SUB.slow; }

const $ = (id) => document.getElementById(id);

/* === shared UI / scoring helpers (refactor) === */
function isPathMode(){ return S.mode==='path' || S.mode==='path-retro'; }
function updatePathProgress(){
  const wrap = $('path-progress');
  const dots = $('path-dots');
  const now = $('path-now');
  if(!wrap || !dots) return;
  if(!isPathMode()){ wrap.classList.remove('on'); dots.innerHTML=''; if(now) now.textContent=''; return; }
  wrap.classList.add('on');
  const list = S.pathList || PATH;
  const mode = list[S.pathIdx] || list[0];
  if(now) now.textContent = '而家：' + (MODE_LABEL[mode] || mode) + '（' + (S.pathIdx+1) + '/' + list.length + '）';
  let h = '';
  list.forEach(function(m,i){
    const cls = i < S.pathIdx ? 'done' : (i === S.pathIdx ? 'now' : '');
    h += '<span class="dot '+cls+'" title="'+(MODE_LABEL[m]||m)+'" aria-label="'+(MODE_LABEL[m]||m)+'"></span>';
  });
  dots.innerHTML = h;
}

function showStageClear(nextMode, thenFn){
  const ov=$('stage-overlay'); if(!ov){ thenFn(); return; }
  $('stage-emoji').textContent='⭐';
  $('stage-title').textContent='過關！';
  $('stage-sub').textContent='下一關：'+(MODE_LABEL[nextMode]||nextMode);
  ov.classList.add('on'); ov.setAttribute('aria-hidden','false');
  AudioFX.ok();
  speak('過關。下一關'+(MODE_LABEL[nextMode]||''));
  clearTimeout(showStageClear._t);
  showStageClear._then=thenFn;
  showStageClear._t=setTimeout(function(){
    ov.classList.remove('on'); ov.setAttribute('aria-hidden','true');
    const f=showStageClear._then; showStageClear._then=null; if(f) f();
  }, 1200);
}
function advancePathOrEnd(){
  if(isPathMode() && S.pathIdx < S.pathList.length-1){
    const nextIdx = S.pathIdx + 1;
    const nextMode = S.pathList[nextIdx];
    showStageClear(nextMode, function(){
      S.pathIdx = nextIdx;
      startMode(nextMode);
    });
    return;
  }
  endGame();
}
function setHudScore(){ const el=$('hud-score'); if(el) el.textContent='★ '+S.correct; }
function setHudQ(cur, total){ const el=$('hud-q'); if(el) el.textContent=cur+'/'+total; }
function setFb(ok, text){ const fb=$('fb'); if(!fb) return; fb.textContent=text; fb.className=ok?'fb ok':'fb bad'; }
function showAfterRow(on, ok){

}

function rollbackLastPick(){

  S.locked=false; S.pickOk=false; setHudScore();

function rightLabel(q){

}
function buyPhrase(id){ return '買'+(ITEMS[id]?ITEMS[id].label:id); }

function ensurePhraseTiles(ansId, extraBad){
  /* Always keep 買 + correct label; pad distractors; never slice them away */
  const correct = ITEMS[ansId].label;
  const verb = '買';
  let dist = shuffle(buildPool().filter(function(x){ return x!==ansId; })).map(function(id){ return ITEMS[id].label; });
  const badVerbs = (extraBad||[]).slice();
  const n = nOpts(); // 2/3/4 -> tile budget
  // tiles: verb + correct + (n-1) distract labels + optional bad verbs on hard
  let out = [verb, correct];
  while(out.length < 2 + Math.max(1, n-1) && dist.length){
    const t = dist.shift();
    if(out.indexOf(t)<0) out.push(t);
  }
  if(S.diff==='hard'){
    badVerbs.forEach(function(v){ if(out.indexOf(v)<0) out.push(v); });
  }
  // hard cap display but MUST include verb+correct
  const maxTiles = S.diff==='easy'?3:S.diff==='mid'?4:5;
  const required = [verb, correct];
  const rest = shuffle(out.filter(function(t){ return required.indexOf(t)<0; }));
  out = required.concat(rest).slice(0, Math.max(required.length, maxTiles));
  // if slice dropped required (shouldn't), force
  required.forEach(function(t){ if(out.indexOf(t)<0) out.unshift(t); });
  return shuffle(out);
}

function pickChoices(answerId, pool, n){
  const src=(pool || poolAll()).filter(function(x){return x!==answerId;});
  let choices=[answerId];
  const distract=shuffle(src);
  while(choices.length<n && distract.length) choices.push(distract.shift());
  // D1：唔可以靜靜補範圍外嘅詞。pool 夠就寧願少一個選項（該題難度實際降低），
  // 只有 pool 連 2 個選項都砌唔到，先退回全池，避免出到冇得揀嘅題。
  if(choices.length<2){
    const more=shuffle(ALL.filter(function(x){return x!==answerId && choices.indexOf(x)<0;}));
    while(choices.length<2 && more.length) choices.push(more.shift());
  }
  return shuffle(choices);
}

}

function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function nOpts(){ return S.diff==='easy'?2:S.diff==='mid'?3:4; }

// D1：老師鎖定詞彙範圍時，全模式共用嘅詞彙池
// 注意：poolAll() 永遠唔回傳分類詞——聽圖選同 arcade 都要圖。
// 鎖「分類詞」時呢度會 fallback 去全部有圖詞彙，並提示老師（分類詞只適用於砌短語）。
function poolAll(){
  if(S.vocabScope==='all') return SELECTABLE;
  const p = SELECTABLE.filter(k => ITEMS[k].cat === S.vocabScope);
  return p.length ? p : SELECTABLE;
}
// 砌短語（產出）嘅池：包含分類詞，因為「買文具」係合語法嘅
function buildPool(){
  if(S.vocabScope==='all') return ALL;
  const p = ALL.filter(k => ITEMS[k].cat === S.vocabScope);
  return p.length ? p : ALL;
}
function pickPool(mode){
  // 鎖定範圍 → 一律用該範圍，唔再隨機抽
  if(S.vocabScope!=='all'){
    const p = (mode==='build' ? ALL : SELECTABLE).filter(k => ITEMS[k].cat === S.vocabScope);
    if(p.length) return p;
  }
  if(mode==='build') return ALL;
  if(mode==='listen' || mode==='shop'){
    const cats = PIC_CATS.filter(c => c!=='category');
    const c = cats[Math.floor(Math.random()*cats.length)];
    return SELECTABLE.filter(k => ITEMS[k].cat === c);
  }
  return SELECTABLE;
}

/* ===== 記錄層 Record（評估用途）=====
 * 每題留低：首次答對、重試次數、詞彙範圍、句子。
 * localStorage 單機即可，全部 key 帶 .v1 版本後綴，日後改結構可並行讀取。
 * 唔計分、唔影響遊戲——純粹記低，唔參與任何回饋。
 */
const RECORD_KEY   = 'bxm.records.v1';
const SESSION_KEY  = 'bxm.session.v1';

function storeGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function storeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.warn('[Record] 寫入失敗', key, e); return false; }
}

const Record = {
  session: null,
  _buf: Object.create(null),

  start(meta){
    this.session = {
      id: 's-' + Date.now().toString(36),
      ts: new Date().toISOString(),
      student: (meta && meta.student) || 'A',
      arcade: (meta && meta.arcade) || '',
      diff: S.diff,
      vocabScope: S.vocabScope,
      qCount: S.qCount,
      pathList: (S.pathList || []).slice(),
      records: []
    };
    this._buf = Object.create(null);
    storeSet(SESSION_KEY, this.session);
  },

  // q = S.cur。retry 唔會換 S.recSeq，所以同一題嘅多次作答會歸併成一筆。
  attempt(ok, q){
    if(!this.session || !q || q.ans == null) return;
    const key = String(S.recSeq);
    let r = this._buf[key];
    if(!r){
      const it = ITEMS[q.ans] || {};
      r = {
        seq: this.session.records.length + 1,
        itemId: q.ans,
        word: it.label || '',
        cat: it.cat || '',
        hasImg: !!it.img,
        mode: q.type,
        diff: S.diff,
        vocabScope: S.vocabScope,
        stem: q.stem || '',
        target: q.phrase || q.ansText || '',
        // D9：砌短語會把「買 + 答案」直接顯示喺題目提示，即答案喺畫面上。
        // 報告唔可以當成真正產出，要標註。
        answerVisible: q.type === 'build',
        attempts: 0,
        correct: false,
        firstTry: false
      };
      this._buf[key] = r;
      this.session.records.push(r);
    }
    r.attempts++;
    if(ok){ r.correct = true; r.firstTry = (r.attempts === 1); }
    storeSet(SESSION_KEY, this.session);
  },

  finish(){
    if(!this.session) return null;
    const done = this.session;
    // 純 arcade 段落冇經 onPick，會係 0 筆記錄 — 唔好污染評估資料
    if(done.records.length){
      const all = storeGet(RECORD_KEY, []);
      all.push(done);
      storeSet(RECORD_KEY, all);
    }
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    this.session = null;
    this._buf = Object.create(null);
    return done;
  },

  load(){ return storeGet(RECORD_KEY, []); },

  clear(){
    try{ localStorage.removeItem(RECORD_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
    this.session = null;
    this._buf = Object.create(null);
  }
};

/* TTS */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices() || []; }
loadVoices();
if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice(){
  const v = voices;
  return v.find(x=>/zh-HK|yue.*HK|hong kong/i.test(x.lang+' '+x.name))
    || v.find(x=>/yue|cantonese|廣東/i.test(x.lang+' '+x.name))
    || v.find(x=>/zh-TW|zh_CN|zh-CN|chinese/i.test(x.lang+' '+x.name))
    || null;
}
function speak(text){
  if(!text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK'; u.rate = 0.9;
    const v = pickVoice(); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function questionSpeakText(q){
  if(!q) return '';
  const fn = SPEAK_FOR[q.type];
  if(fn) return fn(q) || '';
  return S.answerSpeak || '';
}
function autoSpeakQuestion(q){
  const t = questionSpeakText(q);
  if(!t) return;
  // iPad/Safari: keep call near user gesture; slight delay lets DOM paint
  setTimeout(function(){ speak(t); }, 180);
}

/* SFX WebAudio */
const AudioFX = {
  ctx:null,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d,type='sine',v=0.2){
    this.init(); const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+d);
    o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d);
  },
  ok(){ this.tone(523,.12); setTimeout(()=>this.tone(659,.12),90); setTimeout(()=>this.tone(784,.18),180); },
  // D3：答錯唔用負面音效。舊版係兩聲下降 square tone（220→180Hz），
  // 語氣上明確係「錯」。改為中性輕音，只確認「已收到輸入」，唔帶好壞判斷。
  nudge(){ this.tone(440,.06,'sine',.06); },
  tap(){ this.tone(660,.05,'triangle',.08); }
};

  }

function stopLive(){
  if(S.live){
    try{ if(S.live.raf) cancelAnimationFrame(S.live.raf); }catch(e){}
    try{ if(S.live.timer) clearInterval(S.live.timer); }catch(e){}
    try{ if(S.live.onKey) window.removeEventListener('keydown', S.live.onKey); }catch(e){}
    try{ if(S.live.onKeyUp) window.removeEventListener('keyup', S.live.onKeyUp); }catch(e){}
    S.live = null;
  }
}
function finishLiveMode(){
  stopLive();
  advancePathOrEnd();
}
function buildQueue(mode, n){
  const q = [];
  if(mode==='need'){
    const scenes = shuffle(NEED_SCENES);
    for(let i=0;i<n;i++) q.push({type:'need', scene: scenes[i%scenes.length]});
    return q;
  }
  for(let i=0;i<n;i++){
    if(mode==='listen') q.push(makeListen());
    else if(mode==='shop') q.push(makeShop());
    else if(mode==='judge') q.push(makeJudge());
    else if(mode==='build') q.push(makeBuild());
  }
  return q;
}
function makeListen(){
  const pool = pickPool('listen');
  const ans = pool[Math.floor(Math.random()*pool.length)];
  const who = ['哥哥','姐姐','妹妹','弟弟','我'][Math.floor(Math.random()*5)];
  const phrase = '買' + ITEMS[ans].label;
  const stem = who + phrase;
  return {type:'listen', ans, stem, phrase, pool};
}
function makeShop(){
  const pool = pickPool('shop');
  const ans = pool[Math.floor(Math.random()*pool.length)];
  const shelf = shuffle(pool).slice(0, Math.min(6, pool.length));
  if(!shelf.includes(ans)) shelf[0]=ans;
  return {type:'shop', ans, phrase:'買'+ITEMS[ans].label, shelf:shuffle(shelf)};
}
function makeJudge(){
  const id = poolAll()[Math.floor(Math.random()*poolAll().length)];
  const label = ITEMS[id].label;
  const badVerb = Math.random()<.5 ? '吃' : '打';
  const good = {text:'買'+label, ok:true, id};
  const bad = {text: badVerb+label, ok:false, id};
  const opts = shuffle([good, bad]);
  // pad distractors for mid/hard with other wrongs
  while(opts.length < nOpts()){
    const other = poolAll()[Math.floor(Math.random()*poolAll().length)];
    const v = ['吃','打'][Math.floor(Math.random()*2)];
    const t = v + ITEMS[other].label;
    if(!opts.some(o=>o.text===t)) opts.push({text:t, ok:false, id:other});
  }
  return {type:'judge', opts: opts.slice(0,nOpts()), ansText:'買'+label, ansId:id};
}
function makeBuild(){
  const pool = pickPool('build');
  const ans = pool[Math.floor(Math.random()*pool.length)];
  return {type:'build', ans, phrase:'買'+ITEMS[ans].label, tiles: ensurePhraseTiles(ans, S.diff==='hard'?['吃','打']:[])};
}

function nextQuestion(){
  if(S.qIndex >= S.queue.length){
    advancePathOrEnd();
    return;
  }
  S.locked=false; S.pickOk=false; S.cur = S.queue[S.qIndex];
  S.recSeq++;   // 記錄層題序（retry 唔會經過呢度，所以唔會重覆計）
  $('hud-q').textContent = `${S.qIndex+1}/${S.queue.length}`;
  $('hud-score').textContent = '★ ' + S.correct;
  clearRoundUI();
  renderQ(S.cur);
  if(S.cur && S.cur.type==='listen') autoSpeakQuestion(S.cur);
}
function renderQ(q){
  const body = $('game-body'); body.innerHTML='';
  if(q.type==='listen') renderListen(q, body);
  else if(q.type==='shop') renderShop(q, body);
  else if(q.type==='judge') renderJudge(q, body);
  else if(q.type==='build') renderBuild(q, body);
  else if(q.type==='need') renderNeed(q, body);
}
function optionCountClass(n){ return n<=2?'n2':n===3?'n3':'n4'; }

function renderListen(q, body){
  // 聽圖選：題幹只提示「聽」，唔劇透答案；靠 TTS 讀 stem
  $('prompt').innerHTML = '聽一聽，揀正確嘅圖';
  S.answerSpeak = q.stem + '。正確係' + q.phrase;
  const replay = document.createElement('button');
  replay.type='button'; replay.className='btn'; replay.id='btn-listen-replay';
  replay.textContent='🔊 再聽一次';
  replay.style.cssText='width:100%;margin:0 0 12px;font-size:1.35rem';
  replay.onclick=function(){ speak(q.stem); };
  const choices = pickChoices(q.ans, q.pool, nOpts());
  const grid = buildOptGrid(choices, function(el, id, i){
    el.dataset.id=id;

  }, function(id, el, grid){

        if(cid===q.ans) n.classList.add('correct');

  });
  body.appendChild(replay);
  body.appendChild(grid);
}

function renderBuild(q, body){

  S.answerSpeak = q.phrase;
  const board = document.createElement('div'); board.className='phrase-board';
  const slot1 = document.createElement('div'); slot1.className='slot'; slot1.id='slot1'; slot1.textContent='①';
  const plus = document.createElement('div'); plus.style.cssText='font-size:1.8rem;font-weight:900;color:#2b8ad9'; plus.textContent='+';
  const slot2 = document.createElement('div'); slot2.className='slot'; slot2.id='slot2'; slot2.textContent='②';
  board.append(slot1, plus, slot2);
  const pool = document.createElement('div'); pool.className='tile-pool';

  q.tiles.forEach(t=>{
    const tile = document.createElement('button');
    tile.type='button'; tile.className='tile'; tile.textContent=t;
    tile.onclick = ()=>{
      if(S.locked || tile.classList.contains('used')) return;
      AudioFX.tap();
      if(!state.v1){ state.v1=t; slot1.textContent=t; slot1.classList.add('filled'); tile.classList.add('used'); }
      else if(!state.v2){
        state.v2=t; slot2.textContent=t; slot2.classList.add('filled'); tile.classList.add('used');

        onPick(ok, tile, pool, q.ans, false, ()=>{
          if(ok){ slot1.style.borderColor='#2faf52'; slot2.style.borderColor='#2faf52'; }

      }

  reset.style.marginTop='10px';
  reset.onclick = ()=>{ if(S.locked) return; state.v1=state.v2=null; slot1.textContent='①'; slot2.textContent='②';
    slot1.classList.remove('filled'); slot2.classList.remove('filled');
    slot1.style.borderColor=''; slot2.style.borderColor='';
    pool.querySelectorAll('.tile').forEach(t=>t.classList.remove('used')); };
  body.append(board, pool, reset);
}
function renderNeed(q, body){
  const scn = q.scene;
  $('prompt').innerHTML = scn.q;
  S.answerSpeak = scn.why + '。正確：' + scn.good;
  const isDontBuy = scn.good.indexOf('唔使') >= 0 || scn.good.indexOf('不用') >= 0;
  const base = [
    {text: scn.good, ok:true, kind: isDontBuy ? 'dont' : 'buy'},
    {text: scn.bad, ok:false, kind:'bad'}
  ];
  const pads = shuffle([
    {text:'亂買一通', ok:false, kind:'bad'},
    {text:'買完即掉', ok:false, kind:'bad'},
    {text:'一次買好多無用', ok:false, kind:'bad'},
    {text:'唔諗就買', ok:false, kind:'bad'}
  ]);
  const seen = {};
  const opts = [];
  function pushU(o){ if(seen[o.text]) return; seen[o.text]=1; opts.push(o); }
  base.forEach(pushU);
  while(opts.length < nOpts() && pads.length) pushU(pads.shift());
  const final = shuffle(opts.slice(0, nOpts()));
  const grid = document.createElement('div');
  grid.className = 'opts ' + optionCountClass(final.length);
  final.forEach(function(o,i){
    const el = document.createElement('button');
    el.type='button'; el.className='opt';
    let img;
    if(o.ok && !isDontBuy && ITEMS[scn.goodId]){
      img = '<img src="'+ITEMS[scn.goodId].img+'" alt="">';
    } else if(o.ok && isDontBuy){
      img = '<div style="width:100%;aspect-ratio:1;border-radius:12px;background:#e8f8ee;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;color:#1f8a3c">OK</div>';
    } else {
      img = '<div style="width:100%;aspect-ratio:1;border-radius:12px;background:#ffe8e8;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;color:#c0392b">X</div>';
    }
    el.innerHTML = '<span class="badge">'+LETTERS[i]+'</span>'+img+'<div class="lab">'+LETTERS[i]+'. '+o.text+'</div>';
    el.onclick = function(){
      onPick(o.ok, el, grid, null, false, function(){
        Array.prototype.forEach.call(grid.children, function(c,idx){
          if(final[idx].ok) c.classList.add('correct');
          else if(c===el && !o.ok) c.classList.add('wrong');
        });
      });
    };
    grid.appendChild(el);
  });
  body.appendChild(grid);
}

function onPick(ok, el, container, ansId, shopMode, extraHL){
  if(S.locked) return;
  Record.attempt(ok, S.cur);   // 記錄層：全部語言模式嘅單一 funnel
  markAnswer(ok);
  if(typeof extraHL === 'function') extraHL();
  else if(container && ansId){
    Array.prototype.forEach.call(container.querySelectorAll('.opt, .shelf-item'), function(n){
      n.classList.add('disabled');
      if(n.dataset.id===ansId) n.classList.add('correct');
      else if(n===el && !ok) n.classList.add('wrong');
    });
  } else if(container){
    Array.prototype.forEach.call(container.querySelectorAll('.opt'), function(n){ n.classList.add('disabled'); });
    if(el) el.classList.add(ok?'correct':'wrong');
  }
  setFb(ok, feedbackFor(ok, S.cur));
  showAfterRow(true, ok);
}

/* ===== RETRO 6 CATCH ===== */
function startCatch(){
  const goal = diffPick(6,8,10);
  const poolN = diffPick(2,4,Math.min(6, poolAll().length));
  const basePool = shuffle(poolAll()).slice(0, poolN);
  let target = basePool[0];
  const body = $('game-body');
  body.innerHTML = ''
    + '<div class="retro-stage scan" id="catch-stage">'
    + '<div class="retro-hud-target" id="catch-target"></div>'
    + '<div class="catch-basket" id="catch-basket"><div class="bin"></div></div>'
    + '</div>'
    + '<div class="retro-ctrl">'
    + '<button type="button" class="big" id="c-left">&lt;</button>'
    + '<button type="button" class="big" id="c-right">&gt;</button>'
    + '</div>';
  $('prompt').innerHTML = '接住正確：<mark id="catch-phrase">買XX</mark>';
  $('hud-q').textContent = '0/' + goal;
  const stage = $('catch-stage');
  const basket = $('catch-basket');
  let x = 50, vx = 0, caught=0, combo=0, items=[], lastSpawn=0, slowUntil=0;
  const keys = {l:false,r:false};
  function setTarget(){
    target = basePool[Math.floor(Math.random()*basePool.length)];
    const ph = '買'+ITEMS[target].label;
    S.answerSpeak = ph;
    S.cur = {type:'catch', phrase:ph, ans:target};
    $('catch-phrase').textContent = ph;
    $('catch-target').innerHTML = '<img src="'+ITEMS[target].img+'" alt=""><span>'+ph+'</span>';
  }
  setTarget();
  function bindHold(el, dir){
    const down = (e)=>{ e.preventDefault(); if(dir<0) keys.l=true; else keys.r=true; vx=dir; };
    const up = ()=>{ keys.l=false; keys.r=false; vx=0; };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  bindHold($('c-left'), -1);
  bindHold($('c-right'), 1);
  stage.addEventListener('pointerdown', (e)=>{
    const r = stage.getBoundingClientRect();
    vx = (e.clientX < r.left + r.width/2) ? -1 : 1;
  });
  stage.addEventListener('pointerup', ()=> vx=0);
  const onKey = (e)=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ keys.l=true; vx=-1; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ keys.r=true; vx=1; e.preventDefault(); }
  };
  const onKeyUp = (e)=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.l=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.r=false;
    if(!keys.l && !keys.r) vx=0;
  };
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKeyUp);
  function spawn(){
    const poison = S.diff==='hard' && Math.random()<0.22;
    let id;
    if(poison){
      id = basePool.filter(function(z){return z!==target;})[0] || basePool[0];
    } else if(Math.random()<0.55){
      id = target;
    } else {
      id = basePool[Math.floor(Math.random()*basePool.length)];
    }
    const el = document.createElement('div');
    el.className = 'fall-item'+(poison?' poison':'');
    el.innerHTML = '<img src="'+ITEMS[id].img+'" alt=""><div class="tag">'+(poison?('吃'+ITEMS[id].label):ITEMS[id].label)+'</div>';
    const ix = 12 + Math.random()*76;
    el.style.left = ix+'%'; el.style.top = '-10%';
    stage.appendChild(el);
    const speed = (S.diff==='easy'?0.004:S.diff==='mid'?0.008:0.015) * (35+Math.random()*25) * catchSub().speedMul;
    items.push({el:el, id:id, x:ix, y:-10, speed:speed, poison:poison, good:(!poison && id===target)});
  }
  let last = performance.now();
  function loop(now){
    if(!S.live || S.live.kind!=='catch') return;
    const dt = Math.min(32, now-last); last=now;
    const slow = now < slowUntil ? 0.45 : 1;
    if(vx) x = Math.max(8, Math.min(92, x + vx * 0.09 * dt * slow));
    basket.style.left = x+'%';
    // spawn 距離 = base × spawnMul：spawnMul 大 = 等耐啲先跌下一個
    if(now - lastSpawn > ((S.diff==='easy'?2800:S.diff==='mid'?2000:1200) * catchSub().spawnMul)/slow){
      spawn(); lastSpawn = now;
    }
    const bL = x-9, bR = x+9, magnet = combo>=2;
    basket.classList.toggle('magnet', magnet);
    basket.classList.toggle('rainbow', combo>=3);
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.y += it.speed * dt * slow * (magnet && it.good ? 1.15 : 1);
      if(magnet && it.good && it.y>55){ it.x += (x - it.x) * 0.08; }
      it.el.style.top = it.y+'%';
      it.el.style.left = it.x+'%';
      if(it.y >= 78 && it.y <= 92 && it.x>=bL && it.x<=bR){
        it.el.remove(); items.splice(i,1);
        S.answered++;
        if(it.good){
          S.correct++; caught++; combo++;
          AudioFX.ok();
          $('fb').textContent = 'OK 買'+ITEMS[target].label+(combo>=3?' COMBO!':'');
          $('fb').className='fb ok';
          if(combo>=3) slowUntil = now + 1000;
          $('hud-score').textContent = '★ '+S.correct;
          $('hud-q').textContent = caught+'/'+goal;
          if(caught >= goal){
            $('fb').textContent = '接貨完成！';
            setTimeout(finishLiveMode, 700);
            return;
          }
          if(Math.random()<0.4) setTarget();
        } else {
          combo=0; AudioFX.nudge();
          $('fb').textContent = '唔啱！應該：買'+ITEMS[target].label;
          $('fb').className='fb bad';
          stage.style.boxShadow='inset 0 0 0 6px rgba(231,76,60,.45)';
          setTimeout(function(){ stage.style.boxShadow=''; }, 350);
        }
      } else if(it.y > 105){
        it.el.remove(); items.splice(i,1);
      }
    }
    S.live.raf = requestAnimationFrame(loop);
  }
  S.live = {kind:'catch', raf:0, onKey:onKey, onKeyUp:onKeyUp};
  S.live.raf = requestAnimationFrame(loop);
}

/* ===== RETRO 8 RUN ===== */
function startRunway(){
  const lanesN = diffPick(2,3,3);
  const goal = diffPick(5,6,8);
  const pool = shuffle(poolAll()).slice(0, diffPick(3,5,5));
  let target = pool[0];
  let lane = Math.floor(lanesN/2);
  let cleared=0, locked=false;
  const body = $('game-body');
  let laneHtml = '';
  for(let i=0;i<lanesN;i++) laneHtml += '<div class="run-lane" data-lane="'+i+'" id="rl'+i+'"></div>';
  body.innerHTML = '<div class="run-stage '+(lanesN===2?'lanes2':'')+'" id="run-stage">'+laneHtml+'</div><div class="retro-ctrl" id="run-ctrl"></div>';
  const ctrl = $('run-ctrl');
  for(let i=0;i<lanesN;i++){
    const b=document.createElement('button'); b.type='button'; b.className='big';
    b.textContent = lanesN===2?(i===0?'< 左':'右 >'):(i===0?'1 左':i===1?'2 中':'3 右');
    b.onclick=(function(ii){ return function(){ setLane(ii); }; })(i);
    ctrl.appendChild(b);
  }
  function setTarget(){
    target = pool[Math.floor(Math.random()*pool.length)];
    const ph='買'+ITEMS[target].label;
    S.answerSpeak=ph; S.cur={type:'run', phrase:ph, ans:target};
    $('prompt').innerHTML = '換線，行入 <mark>'+ph+'</mark>';
  }
  setTarget();
  $('hud-q').textContent='0/'+goal;
  function paintPlayer(){
    for(let i=0;i<lanesN;i++){
      const L=$('rl'+i);
      L.classList.toggle('on', i===lane);
      let pl=L.querySelector('.run-player');
      if(i===lane){
        if(!pl){ pl=document.createElement('div'); pl.className='run-player'; pl.textContent=(S.identity && S.identity.emoji) ? S.identity.emoji : 'P'; L.appendChild(pl); }
      } else if(pl) pl.remove();
    }
  }
  function setLane(i){ if(locked) return; lane=i; paintPlayer(); AudioFX.tap(); }
  paintPlayer();
  document.querySelectorAll('.run-lane').forEach(function(el){
    el.onclick=function(){ setLane(parseInt(el.dataset.lane,10)); };
  });
  const onKey=function(e){
    if(e.key==='ArrowLeft') setLane(Math.max(0,lane-1));
    if(e.key==='ArrowRight') setLane(Math.min(lanesN-1,lane+1));
    if(e.key>='1'&&e.key<=String(lanesN)) setLane(parseInt(e.key,10)-1);
  };
  window.addEventListener('keydown', onKey);
  let gates=[], lastSpawn=0, last=performance.now();
  function spawnGate(){
    const correctLane = Math.floor(Math.random()*lanesN);
    for(let i=0;i<lanesN;i++){
      const good = i===correctLane;
      let id, label, poison=false;
      if(good){ id=target; label='買'+ITEMS[id].label; }
      else {
        if(S.diff!=='easy' && Math.random()<0.35){
          id=target; poison=true; label=(Math.random()<.5?'吃':'打')+ITEMS[id].label;
        } else {
          const others = pool.filter(function(z){return z!==target;});
          id = others.length ? others[Math.floor(Math.random()*others.length)] : pool[0];
          label = '買'+ITEMS[id].label;
        }
      }
      const el=document.createElement('div'); el.className='run-gate';
      el.innerHTML='<img src="'+ITEMS[id].img+'" alt=""><div class="glab">'+label+'</div>';
      el.style.top='-20%';
      $('rl'+i).appendChild(el);
      gates.push({el:el, lane:i, y:-20, good: good && !poison, label:label});
    }
  }
  const speed = S.diff==='easy'?0.018:S.diff==='mid'?0.024:0.03;
  function loop(now){
    if(!S.live||S.live.kind!=='run') return;
    const dt=Math.min(32, now-last); last=now;
    if(!locked && now-lastSpawn > (S.diff==='easy'?2200:1800)){ spawnGate(); lastSpawn=now; }
    const hitY=68;
    for(let i=gates.length-1;i>=0;i--){
      const g=gates[i];
      if(locked && g._freeze) continue;
      g.y += speed*dt*(S.diff==='hard'?1.1:1);
      g.el.style.top = g.y+'%';
      if(!locked && g.y>=hitY && g.y<hitY+8 && g.lane===lane){
        locked=true;
        const rowGates = gates.filter(function(x){ return Math.abs(x.y-g.y)<12; });
        const picked = rowGates.find(function(x){ return x.lane===lane; });
        rowGates.forEach(function(x){ x._freeze=true; });
        S.answered++;
        const ok = picked && picked.good;
        if(ok){
          S.correct++; cleared++;
          AudioFX.ok();
          $('rl'+lane).classList.add('good-flash');
          $('fb').textContent='OK '+picked.label; $('fb').className='fb ok';
          $('hud-score').textContent='★ '+S.correct;
          $('hud-q').textContent=cleared+'/'+goal;
          setTimeout(function(){
            $('rl'+lane).classList.remove('good-flash');
            for(let j=gates.length-1;j>=0;j--){
              if(Math.abs(gates[j].y-g.y)<12){ gates[j].el.remove(); gates.splice(j,1); }
            }
            locked=false;
            if(cleared>=goal){ $('fb').textContent='走線完成！'; setTimeout(finishLiveMode,650); return; }
            if(Math.random()<0.5) setTarget();
          }, 700);
        } else {
          AudioFX.nudge();
          $('rl'+lane).classList.add('bad-flash');
          const right = rowGates.find(function(x){ return x.good; });
          if(right) $('rl'+right.lane).classList.add('good-flash');
          $('fb').textContent='唔啱！應該：'+(right?right.label:('買'+ITEMS[target].label));
          $('fb').className='fb bad';
          setTimeout(function(){
            $('rl'+lane).classList.remove('bad-flash');
            rowGates.forEach(function(x){ if(x.good) $('rl'+x.lane).classList.remove('good-flash'); });
            for(let j=gates.length-1;j>=0;j--){
              if(Math.abs(gates[j].y-g.y)<12){ gates[j].el.remove(); gates.splice(j,1); }
            }
            locked=false;
          }, 1100);
        }
      } else if(g.y>110){
        g.el.remove(); gates.splice(i,1);
      }
    }
    S.live.raf=requestAnimationFrame(loop);
  }
  S.live={kind:'run', raf:0, onKey:onKey};
  S.live.raf=requestAnimationFrame(loop);
}

/* ===== RETRO 12 TALK ===== */
function startTalk(){
  const n = S.qCount || 4;
  const customers = [];
  for(let i=0;i<n;i++){
    const pool = pickPool('build');
    const ans = pool[Math.floor(Math.random()*pool.length)];
    customers.push(ans);
  }
  let idx=0, step=0, v1=null, v2=null, receipts=[];
  S.cur={type:'talk'};
  const body=$('game-body');
  function render(){
    const ans = customers[idx];
    const ph = '買'+ITEMS[ans].label;
    S.answerSpeak = step===0 ? ('我要買'+ITEMS[ans].label) : ph;
    $('hud-q').textContent = (idx+1)+'/'+customers.length;
    $('prompt').innerHTML = step===0 ? '聽店員，揀對應嘅嘢' : (step===1 ? ('砌短語 <mark>'+ph+'</mark>') : '完成！');
    let line = step===0 ? ('我要買'+ITEMS[ans].label) : (step===1 ? ('請講：'+ph) : ('好呀！'+ph+'！'));
    if(step===0) setTimeout(function(){ speak(line); }, 200);
    else if(step===1) setTimeout(function(){ speak(ph); }, 200);
    if(step===0){
      const nopt = nOpts();
      let choices=[ans];
      const dist=shuffle(poolAll().filter(function(x){return x!==ans;}));
      while(choices.length<nopt && dist.length) choices.push(dist.shift());
      choices=shuffle(choices);
      // 店員明示目標 — 顯示目標圖 + 短語 + 🔊 再聽掣
      body.innerHTML = '<div class="talk-wrap"><div class="npc think"><div class="face">NPC</div><div class="pixel-bar">店員</div></div><div><div class="bubble"><mark>'+ITEMS[ans].label+'</mark> 喺邊？</div><div style="display:flex;align-items:center;gap:10px;margin-top:10px"><img src="'+ITEMS[ans].img+'" alt="'+ITEMS[ans].label+'" style="width:72px;height:72px;object-fit:cover;border-radius:12px;border:3px solid #1e5a8a;flex:0 0 auto"><button type="button" class="btn sec" id="talk-replay" style="min-height:48px;padding:6px 14px;font-size:1.05rem">🔊 再聽</button><span style="font-weight:900;color:#1e5a8a;font-size:1.15rem">→ '+line+'</span></div><div class="opts '+(nopt<=2?'n2':nopt===3?'n3':'n4')+'" style="margin-top:12px" id="talk-opts"></div><div style="margin-top:8px" id="talk-rec"></div></div></div>';
      $('talk-rec').innerHTML = receipts.map(function(r){return '<span class="receipt"># '+r+'</span>';}).join('');
      const replayBtn=$('talk-replay');
      if(replayBtn) replayBtn.onclick=function(){ speak(line); };
      const grid=$('talk-opts');
      choices.forEach(function(id,i){
        const el=document.createElement('button'); el.type='button'; el.className='opt';
        el.innerHTML='<span class="badge">'+LETTERS[i]+'</span><img src="'+ITEMS[id].img+'" alt=""><div class="lab">'+LETTERS[i]+'. '+ITEMS[id].label+'</div>';
        el.onclick=function(){
          if(S.locked) return;
          S.locked=true; S.answered++;
          const ok=id===ans; S.pickOk=ok;
          if(ok){
            S.correct++; AudioFX.ok(); step=1; S.locked=false;
            $('fb').textContent='啱！跟住砌短語'; $('fb').className='fb ok';
            $('hud-score').textContent='★ '+S.correct; render();
          } else {
            AudioFX.nudge(); el.classList.add('wrong');
            Array.prototype.forEach.call(grid.children, function(c,ci){ if(choices[ci]===ans) c.classList.add('correct'); c.classList.add('disabled'); });
            $('fb').textContent='唔啱，應該：'+ph; $('fb').className='fb bad';
            showAfterRow(true, false);
            S.cur={type:'talk', phrase:ph, ans:ans, _talkRetry:function(){ S.locked=false; step=0; clearRoundUI(); render(); }};
          }
        };
        grid.appendChild(el);
      });
    } else if(step===1){
      let tiles = ensurePhraseTiles(ans, ['吃','打']);
      v1=null; v2=null;
      body.innerHTML = '<div class="talk-wrap"><div class="npc think"><div class="face">NPC</div><div class="pixel-bar">店員</div></div><div><div class="bubble">'+line+'</div><div class="phrase-board"><div class="slot" id="ts1">1</div><div style="font-size:1.6rem;font-weight:900">+</div><div class="slot" id="ts2">2</div></div><div class="tile-pool" id="tpool"></div><button type="button" class="btn sec" id="t-clear" style="margin-top:8px">清空重砌</button><div style="margin-top:8px" id="talk-rec"></div></div></div>';
      $('talk-rec').innerHTML = receipts.map(function(r){return '<span class="receipt"># '+r+'</span>';}).join('');
      const pool=$('tpool');
      tiles.forEach(function(t){
        const tile=document.createElement('button'); tile.type='button'; tile.className='tile'; tile.textContent=t;
        tile.onclick=function(){
          if(tile.classList.contains('used')||S.locked) return;
          AudioFX.tap();
          if(!v1){ v1=t; $('ts1').textContent=t; $('ts1').classList.add('filled'); tile.classList.add('used'); }
          else if(!v2){
            v2=t; $('ts2').textContent=t; $('ts2').classList.add('filled'); tile.classList.add('used');
            const ok=v1==='買'&&v2===ITEMS[ans].label;
            S.locked=true; S.answered++; S.pickOk=ok;
            if(ok){
              S.correct++; AudioFX.ok();
              receipts.push(ph);
              $('fb').textContent='OK '+ph; $('fb').className='fb ok';
              $('hud-score').textContent='★ '+S.correct;
              step=2; S.locked=false; render();
              setTimeout(function(){
                idx++;
                if(idx>=customers.length){ finishLiveMode(); return; }
                step=0; S.locked=false; $('fb').textContent=''; render();
              }, 900);
            } else {
              AudioFX.nudge();
              $('ts1').style.borderColor='#e74c3c'; $('ts2').style.borderColor='#e74c3c';
              $('fb').textContent='唔啱，應該：'+ph; $('fb').className='fb bad';
              showAfterRow(true, false);
              S.cur={type:'talk', phrase:ph, ans:ans, _talkRetry:function(){ S.locked=false; v1=null; v2=null; step=1; clearRoundUI(); render(); }};
            }
          }
        };
        pool.appendChild(tile);
      });
      $('t-clear').onclick=function(){ if(S.locked)return; v1=null; v2=null; render(); };
    } else {
      body.innerHTML = '<div class="talk-wrap"><div class="npc happy"><div class="face">NPC</div></div><div><div class="bubble">好呀！'+ph+'！畀你收據</div><div style="margin-top:10px">'+receipts.map(function(r){return '<span class="receipt"># '+r+'</span>';}).join('')+'</div></div></div>';
    }
  }

  S.live={kind:'talk'};
  render();
}

/* ===== CART RUSH — gameplay-heavy mode ===== */
function startCartRush(){
  // 賽道對決 — 答啱加速 / 答錯減速 / 對手 AI 持續前進
  const totalItems = diffPick(6, 7, 8);
  const maxLives   = 3;
  const TRACK      = 100;            // 0-100 賽道單位
  const itemGap    = TRACK / (totalItems + 1);

  // 6-8 條獨立題,每條唔同 item
  const itemIds = shuffle(poolAll()).slice(0, Math.min(totalItems, poolAll().length));

  // State
  let playerDist = 0;
  let aiDist     = 0;
  const basePlayerSpeed = 0.038;     // 38%/s → ~2.6s 完成
  const aiSpeed         = 0.044;     // 44%/s → AI 略快,要用答啱先追到
  let playerSpeed = basePlayerSpeed;
  let boostMs = 0;
  let slowMs  = 0;
  let strikes = 0;
  let won     = false;
  let lost    = false;
  let finished= false;
  let nextItemIdx = 0;
  let stageLocked = false;

  const body   = $('game-body');
  const prompt = $('prompt');

  body.innerHTML = ''
    + '<div class="cart-stage" id="cart-stage">'
    +   '<div class="cart-sky">'
    +     '<div class="cart-cloud c1"></div>'
    +     '<div class="cart-cloud c2"></div>'
    +     '<div class="cart-cloud c3"></div>'
    +   '</div>'
    +   '<div class="cart-ai-lane"></div>'
    +   '<div class="cart-player-lane"></div>'
    +   '<div class="cart-finish"></div>'
    +   '<div class="cart-puff cart-puff-ai" id="cart-puff-ai"></div>'
    +   '<div class="cart-puff cart-puff-player" id="cart-puff-player"></div>'
    +   '<div class="cart-items" id="cart-items"></div>'
    +   '<div class="cart-car cart-car-ai" id="cart-car-ai"></div>'
    +   '<div class="cart-car cart-car-player" id="cart-car-player"></div>'
    +   '<div class="cart-banner" id="cart-banner"></div>'
    +   '<div class="cart-q-overlay" id="cart-overlay">'
    +     '<div class="cart-q-card">'
    +       '<div class="cart-strikes" id="cart-strikes"></div>'
    +       '<div class="cart-q-target" id="cart-q-target"></div>'
    +       '<div class="opts n2" id="cart-q-grid"></div>'
    +       '<div class="fb" id="cart-fb"></div>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="cart-hud">'
    +   '<div class="cart-hud-row">'
    +     '<span class="cart-hud-label">🦊 對手</span>'
    +     '<div class="cart-progress"><div class="cart-progress-ai" id="cart-progress-ai"></div></div>'
    +   '</div>'
    +   '<div class="cart-hud-row">'
    +     '<span class="cart-hud-label">🛒 我</span>'
    +     '<div class="cart-progress"><div class="cart-progress-player" id="cart-progress-player"></div></div>'
    +   '</div>'
    + '</div>';

  const stage       = $('cart-stage');
  const carPlayer   = $('cart-car-player');
  const carAi       = $('cart-car-ai');
  const itemsEl     = $('cart-items');
  const overlay     = $('cart-overlay');
  const progPlayer  = $('cart-progress-player');
  const progAi      = $('cart-progress-ai');
  const puffPlayer  = $('cart-puff-player');
  const puffAi      = $('cart-puff-ai');
  const banner      = $('cart-banner');

  // 放 item 入賽道
  for(let i=0; i<totalItems; i++){
    const id = itemIds[i];
    const d  = document.createElement('div');
    d.className = 'cart-item';
    d.dataset.worldX = itemGap * (i+1);
    d.dataset.idx = i;
    d.dataset.id  = id;
    d.innerHTML = '📦';
    itemsEl.appendChild(d);
  }

  function showBanner(text, ms){
    banner.textContent = text;
    banner.classList.add('on');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(function(){ banner.classList.remove('on'); }, ms||900);
  }

  function renderStrikes(){
    const el = $('cart-strikes');
    if(!el) return;
    let h='';
    for(let i=0;i<maxLives;i++) h+='<div class="cart-strike'+(i<maxLives-strikes?'':' lost')+'>'+(i<maxLives-strikes?'❤':'💔')+'</div>';
    el.innerHTML=h;
  }

  function applyBoost(){
    boostMs = 1700;
    playerSpeed = basePlayerSpeed * 1.95;
    carPlayer.classList.add('boosting');
    puffPlayer.classList.add('on');
    setTimeout(function(){ carPlayer.classList.remove('boosting'); puffPlayer.classList.remove('on'); }, 1700);
  }
  function applySlow(){
    slowMs = 1300;
    playerSpeed = basePlayerSpeed * 0.4;
    carPlayer.classList.add('slowed');
    puffPlayer.classList.add('on','slow');
    setTimeout(function(){ carPlayer.classList.remove('slowed'); puffPlayer.classList.remove('on','slow'); }, 1300);
  }

  function showQuestion(itemIdx, itemId){
    const ans = itemId;
    const ph  = '買' + ITEMS[ans].label;
    S.answerSpeak = ph;
    S.cur = {type:'cart', phrase:ph, ans:ans};

    prompt.innerHTML = '答啱加速！<mark>'+ph+'</mark>';
    speak('我要買' + ITEMS[ans].label);

    $('cart-q-target').innerHTML = '<img src="'+ITEMS[ans].img+'" alt=""><span>'+ph+'</span>';
    renderStrikes();

    const nopt = nOpts();
    const choices = pickChoices(ans, poolAll(), nopt);
    const grid = $('cart-q-grid');
    grid.className = 'opts ' + optionCountClass(choices.length);
    grid.innerHTML = '';
    stageLocked = true;

    choices.forEach(function(id, i){
      const btn = document.createElement('button');
      btn.type='button'; btn.className='opt';
      btn.innerHTML = '<span class="badge">'+LETTERS[i]+'</span><img src="'+ITEMS[id].img+'" alt=""><div class="lab">'+LETTERS[i]+'. '+ITEMS[id].label+'</div>';
      btn.onclick = function(){
        if(!stageLocked || btn.disabled) return;
        const ok = id===ans;
        // 鎖哂所有 button
        Array.prototype.forEach.call(grid.querySelectorAll('.opt'), function(c){ c.disabled = true; });
        S.answered++;
        if(ok){
          S.correct++;
          AudioFX.ok();
          btn.classList.add('correct');
          $('cart-fb').textContent = '✅ 加速！' + ph;
          $('cart-fb').className   = 'fb ok';
          $('hud-score').textContent = '★ ' + S.correct;
          $('hud-q').textContent    = (nextItemIdx+1) + '/' + totalItems;
          showBanner('🚀 加速！', 700);
          applyBoost();
          setTimeout(function(){
            overlay.classList.remove('on');
            stageLocked = false;
            nextItemIdx++;
            // 隱藏撞到嘅 item
            const it = itemsEl.querySelector('[data-idx="'+itemIdx+'"]');
            if(it){ it.classList.add('hit'); }
            prompt.innerHTML = '快啲答！對手追緊！';
          }, 900);
        } else {
          strikes++;
          AudioFX.nudge();
          btn.classList.add('wrong');
          // 標示啱嗰粒 + 解返佢俾學生再撳
          Array.prototype.forEach.call(grid.querySelectorAll('.opt'), function(c,ci){
            if(choices[ci]===ans){
              c.classList.add('correct');
              c.disabled = false;
            }
          });
          $('cart-fb').textContent = '❌ 應該：'+ph + '（撳啱嗰粒先繼續）';
          $('cart-fb').className   = 'fb bad';
          showBanner('💨 慢咗！', 700);
          applySlow();
          renderStrikes();
          if(strikes >= maxLives){
            // 輸咗,等 overlay 顯示完就結束
            setTimeout(function(){
              overlay.classList.remove('on');
              stageLocked = false;
              finishRace(false);
            }, 1400);
          } else {
            prompt.innerHTML = '答啱先繼續：<mark>'+ph+'</mark>';
            // 唔關 overlay,等學生再撳啱嗰粒
          }
        }
      };
      grid.appendChild(btn);
    });

    overlay.classList.add('on');
  }

  function finishRace(playerWon){
    if(finished) return;
    finished = true;
    if(playerWon){
      won = true;
      prompt.innerHTML = '🏆 你贏咗！';
      speak('你贏咗');
      showBanner('🏆 衝線！', 1500);
    } else {
      lost = true;
      prompt.innerHTML = '💔 對手贏咗';
      speak('對手贏咗');
      showBanner('💔 輸咗', 1500);
    }
    setTimeout(finishLiveMode, 1400);
  }

  // ----- main loop -----
  let last = performance.now();

  function positionItems(){
    const sw = stage.clientWidth || 600;
    // 視窗內可見 ~32 個 track 單位(在 player 前)
    const visibleUnits = 32;
    const pxPerUnit = sw / visibleUnits;
    Array.prototype.forEach.call(itemsEl.children, function(d){
      if(d.classList.contains('hit')) return;
      const wx = parseFloat(d.dataset.worldX);
      const screenX = (wx - playerDist) * pxPerUnit;
      if(screenX < -80 || screenX > sw + 80){
        d.style.display = 'none';
      } else {
        d.style.display = '';
        d.style.left = screenX + 'px';
      }
    });
  }

  function loop(now){
    if(!S.live || S.live.kind!=='cart') return;
    const dt = Math.min(32, now - last);
    last = now;

    if(!finished){
      // 速度衰減
      if(boostMs > 0){
        boostMs -= dt;
        if(boostMs <= 0) playerSpeed = basePlayerSpeed;
      } else if(slowMs > 0){
        slowMs -= dt;
        if(slowMs <= 0) playerSpeed = basePlayerSpeed;
      }

      // AI 永遠行(就算 locked)
      aiDist += aiSpeed * dt;
      if(aiDist > TRACK) aiDist = TRACK;

      if(!stageLocked){
        // Player 行
        playerDist += playerSpeed * dt;
        if(playerDist > TRACK) playerDist = TRACK;

        // 撞 item
        while(nextItemIdx < totalItems){
          const d = itemsEl.children[nextItemIdx];
          if(!d) break;
          if(d.classList.contains('hit')){ nextItemIdx++; continue; }
          const wx = parseFloat(d.dataset.worldX);
          if(playerDist >= wx - 0.5 && playerDist <= wx + 3){
            const id = parseInt(d.dataset.id, 10);
            showQuestion(nextItemIdx, id);
            break;
          } else if(playerDist < wx - 0.5){
            break;
          } else {
            nextItemIdx++;
          }
        }

        // Win/Lose
        if(playerDist >= TRACK) finishRace(true);
        else if(aiDist >= TRACK) finishRace(false);
      }

      // Update HUD
      progPlayer.style.width = (playerDist / TRACK * 100) + '%';
      progAi.style.width     = (aiDist     / TRACK * 100) + '%';
      positionItems();
    }

    S.live.raf = requestAnimationFrame(loop);
  }

  $('hud-q').textContent    = '0/' + totalItems;
  $('hud-score').textContent = '★ 0';
  prompt.innerHTML = '🏁 賽道對決！答啱加速 / 答錯慢';
  S.live = {kind:'cart', raf:0};
  S.live.raf = requestAnimationFrame(loop);
}

function endGame(){
  stopLive();
  Record.finish();
  show('screen-end');
  const total = Math.max(1, S.answered);
  const pct = S.correct / total;
  let medal='🥉', title='銅獎證書';
  if(pct>=0.9){ medal='🥇'; title='金獎證書'; }
  else if(pct>=0.7){ medal='🥈'; title='銀獎證書'; }
  else if(pct>=0.5){ medal='🥉'; title='銅獎證書'; }
  else { medal='🌟'; title='努力證書'; }
  $('end-medal').textContent=medal;
  $('end-title').textContent=title;
  $('end-name').textContent = S.identity.emoji + ' ' + S.identity.name;
  $('end-score').textContent = `答對 ${S.correct} / ${S.answered}`;
  speak(title + '。' + S.identity.name + '做得好');
}

if($('stage-overlay')) $('stage-overlay').onclick=function(){
  if(!this.classList.contains('on')) return;
  clearTimeout(showStageClear._t);
  this.classList.remove('on'); this.setAttribute('aria-hidden','true');
  if(showStageClear._then){ const f=showStageClear._then; showStageClear._then=null; f(); }
};
